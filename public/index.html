<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sasta.pk — Compare prices across Pakistan's top stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="googleFontsLink" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #FAF7F0; --color-surface: #FFFFFF; --color-ink: #17231D;
    --color-ink-soft: #5B6B62; --color-brand: #0B6E4F; --color-brand-dark: #094F39;
    --color-accent: #E8A33D; --color-accent-dark: #C4841F; --color-line: #E4DDCB;
    --color-danger: #C24B3F; --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif; --radius: 14px;
  }
</style>
<script>
  window.APP_CONFIG = { API_BASE_URL: "", BRAND_NAME: "Sasta.pk" };
</script>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }

  header { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; max-width: 1080px; margin: 0 auto; }
  .logo { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--color-brand-dark); }
  .logo .dot { color: var(--color-accent); }

  .hero { max-width: 720px; margin: 28px auto 8px; padding: 0 24px; text-align: center; }
  .hero h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 5vw, 36px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.01em; }
  .hero p { color: var(--color-ink-soft); margin: 0 0 24px; font-size: 15px; }
  .search-box { position: relative; max-width: 560px; margin: 0 auto; }
  .search-box input { width: 100%; padding: 16px 52px 16px 20px; font-size: 16px; font-family: var(--font-body); border: 1.5px solid var(--color-line); border-radius: 999px; background: var(--color-surface); color: var(--color-ink); }
  .search-box input:focus { border-color: var(--color-brand); box-shadow: 0 0 0 4px rgba(11, 110, 79, 0.1); }
  .search-box svg { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--color-ink-soft); pointer-events: none; }

  .filter-bar { max-width: 1080px; margin: 22px auto 0; padding: 14px 24px; display: none; gap: 18px; flex-wrap: wrap; align-items: center; }
  .filter-bar.visible { display: flex; }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-label { font-size: 12px; font-weight: 600; color: var(--color-ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .store-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--color-line); background: var(--color-surface); cursor: pointer; user-select: none; transition: opacity 0.15s ease; }
  .store-chip.off { opacity: 0.35; }
  .price-input { width: 90px; padding: 7px 10px; border: 1.5px solid var(--color-line); border-radius: 8px; font-size: 13px; font-family: var(--font-body); }
  .toggle-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--color-line); background: var(--color-surface); cursor: pointer; }
  select#sortSelect { padding: 7px 10px; border: 1.5px solid var(--color-line); border-radius: 8px; font-size: 13px; font-family: var(--font-body); background: var(--color-surface); color: var(--color-ink); }

  .status-line { max-width: 1080px; margin: 16px auto 4px; padding: 0 24px; font-size: 13px; color: var(--color-ink-soft); min-height: 18px; }
  .status-line strong { color: var(--color-ink); }

  .results { max-width: 1080px; margin: 0 auto; padding: 8px 24px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }

  .card { background: var(--color-surface); border-radius: var(--radius); border: 1px solid var(--color-line); position: relative; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(23, 35, 29, 0.08); }
  .card::before, .card::after { content: ""; position: absolute; width: 16px; height: 16px; background: var(--color-bg); border-radius: 50%; top: 128px; z-index: 2; }
  .card::before { left: -8px; } .card::after { right: -8px; }
  .card-image { height: 128px; display: flex; align-items: center; justify-content: center; padding: 14px; background: #FCFAF4; position: relative; }
  .card-image img { max-height: 100%; max-width: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .card-perforation { border-top: 1.5px dashed var(--color-line); margin: 0 18px; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-top-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .store-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: #fff; width: fit-content; }
  .discount-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #FDEDEA; color: var(--color-danger); }
  .card-title { font-size: 14px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-rating { font-size: 11.5px; color: var(--color-ink-soft); display: flex; align-items: center; gap: 4px; }
  .card-rating .stars { color: var(--color-accent-dark); }
  .price-row { margin-top: auto; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
  .price-original { font-size: 12px; color: var(--color-ink-soft); text-decoration: line-through; }
  .best-ribbon { position: absolute; top: 10px; left: 10px; background: var(--color-accent); color: #2A1B04; font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; z-index: 3; }
  .out-of-stock { filter: grayscale(0.5); opacity: 0.6; }
  .out-of-stock-tag { font-size: 11px; color: var(--color-danger); font-weight: 600; }
  .updated-at { font-size: 10.5px; color: var(--color-ink-soft); opacity: 0.8; }

  .state-panel { max-width: 420px; margin: 60px auto; text-align: center; padding: 0 24px; }
  .state-panel .icon { font-size: 34px; margin-bottom: 12px; }
  .state-panel h3 { font-family: var(--font-display); font-size: 18px; margin: 0 0 6px; }
  .state-panel p { color: var(--color-ink-soft); font-size: 14px; margin: 0; }

  .skeleton { background: linear-gradient(90deg, #F1EDE1 25%, #E9E3D3 37%, #F1EDE1 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius); height: 240px; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  footer { text-align: center; padding: 24px; font-size: 12px; color: var(--color-ink-soft); }
</style>
</head>
<body>

<header>
  <div class="logo" id="logoSlot">Sasta<span class="dot">.pk</span></div>
</header>

<div class="hero">
  <h1 id="heroQuote">Compare prices across Pakistan's top stores.</h1>
  <p id="heroSubtitle">Search once, compare instantly across Pakistan's top stores.</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search e.g. Xiaomi Redmi 15C" autocomplete="off" aria-label="Search for a product">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <div class="filter-group"><span class="filter-label">Stores</span><div id="storeChips"></div></div>
  <div class="filter-group">
    <span class="filter-label">Price</span>
    <input type="number" class="price-input" id="minPrice" placeholder="Min">
    <input type="number" class="price-input" id="maxPrice" placeholder="Max">
  </div>
  <div class="filter-group"><label class="toggle-chip"><input type="checkbox" id="inStockOnly" style="margin:0"> In stock only</label></div>
  <div class="filter-group">
    <span class="filter-label">Sort</span>
    <select id="sortSelect">
      <option value="relevance">Relevance</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="rating">Rating</option>
    </select>
  </div>
</div>

<div class="status-line" id="statusLine"></div>
<div class="results" id="results"></div>

<footer id="footerSlot">Sasta.pk — prices are pulled directly from each store and may change without notice.</footer>

<script>
(function () {
  const CFG = window.APP_CONFIG;
  document.title = `${CFG.BRAND_NAME} — Compare prices across Pakistan's top stores`;

  const input = document.getElementById("searchInput");
  const results = document.getElementById("results");
  const statusLine = document.getElementById("statusLine");
  const filterBar = document.getElementById("filterBar");
  const storeChipsEl = document.getElementById("storeChips");
  const minPriceEl = document.getElementById("minPrice");
  const maxPriceEl = document.getElementById("maxPrice");
  const inStockOnlyEl = document.getElementById("inStockOnly");
  const sortSelectEl = document.getElementById("sortSelect");

  let debounceTimer = null, priceDebounceTimer = null, pollTimer = null;
  let currentQuery = "";
  let allStores = [];
  let excludedStores = new Set();
  let settings = null;

  function formatPKR(n) {
    if (n === null || n === undefined) return null;
    return "Rs " + Number(n).toLocaleString("en-PK");
  }

  function relativeTime(dateStr) {
    if (!dateStr) return "";
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "Updated just now";
    if (mins < 60) return `Updated ${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `Updated ${hrs}h ago`;
    return `Updated ${Math.floor(hrs / 24)}d ago`;
  }

  // ---------- Site settings: branding, theme, card feature toggles ----------
  async function loadSettings() {
    try {
      const res = await fetch(`${CFG.API_BASE_URL}/api/settings`);
      settings = await res.json();
    } catch (err) {
      settings = { theme: {}, cardFeatures: {} }; // safe fallback, CSS defaults still apply
    }
    applySettings();
  }

  function applySettings() {
    if (!settings) return;

    document.getElementById("logoSlot").textContent = settings.logoText || "Sasta.pk";
    document.getElementById("heroSubtitle").textContent = settings.heroSubtitle || "";
    document.getElementById("footerSlot").textContent = settings.footerText || "";

    if (settings.heroQuotes && settings.heroQuotes.length > 0) {
      const pick = settings.heroQuotes[Math.floor(Math.random() * settings.heroQuotes.length)];
      document.getElementById("heroQuote").textContent = pick;
    }

    const t = settings.theme || {};
    const root = document.documentElement.style;
    if (t.brandColor) { root.setProperty("--color-brand", t.brandColor); root.setProperty("--color-brand-dark", t.brandColor); }
    if (t.accentColor) { root.setProperty("--color-accent", t.accentColor); }
    if (t.fontDisplay) root.setProperty("--font-display", `"${t.fontDisplay}", sans-serif`);
    if (t.fontBody) root.setProperty("--font-body", `"${t.fontBody}", sans-serif`);
  }

  // ---------- Stores: filter chips ----------
  async function loadStores() {
    try {
      const res = await fetch(`${CFG.API_BASE_URL}/api/stores`);
      const data = await res.json();
      allStores = data.stores || [];
      renderStoreChips();
    } catch (err) {}
  }

  function renderStoreChips() {
    storeChipsEl.innerHTML = allStores
      .map((s) => `<span class="store-chip" data-store="${s.name}" style="border-color:${s.color || '#ccc'}"><span style="width:8px;height:8px;border-radius:50%;background:${s.color || '#999'}"></span>${s.name}</span>`)
      .join("");
    storeChipsEl.querySelectorAll(".store-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const store = chip.dataset.store;
        if (excludedStores.has(store)) { excludedStores.delete(store); chip.classList.remove("off"); }
        else { excludedStores.add(store); chip.classList.add("off"); }
        if (currentQuery) fetchResults(currentQuery);
      });
    });
  }

  function buildParams(query) {
    const params = new URLSearchParams({ q: query, limit: "50" });
    const activeStores = allStores.map((s) => s.name).filter((n) => !excludedStores.has(n));
    if (excludedStores.size > 0 && activeStores.length > 0) params.set("stores", activeStores.join(","));
    if (minPriceEl.value) params.set("minPrice", minPriceEl.value);
    if (maxPriceEl.value) params.set("maxPrice", maxPriceEl.value);
    if (inStockOnlyEl.checked) params.set("inStockOnly", "true");
    params.set("sort", sortSelectEl.value);
    return params;
  }

  function renderSkeleton() {
    results.innerHTML = Array.from({ length: 8 }).map(() => `<div class="skeleton"></div>`).join("");
  }

  function renderEmpty(message, sub) {
    results.innerHTML = "";
    statusLine.innerHTML = "";
    const panel = document.createElement("div");
    panel.className = "state-panel";
    panel.innerHTML = `<div class="icon">🧾</div><h3>${message}</h3><p>${sub}</p>`;
    results.appendChild(panel);
  }

  function starString(rating) {
    if (!rating) return "";
    const full = Math.round(rating);
    return "★".repeat(full) + "☆".repeat(5 - full);
  }

  function renderResults(data, query) {
    const seen = new Set();
    const products = data.products.filter((p) => {
      if (seen.has(p.url)) return false;
      seen.add(p.url);
      return true;
    });

    if (products.length === 0) {
      const msg = data.needsLiveScrape ? "Checking stores now..." : "No results found";
      const sub = data.needsLiveScrape
        ? "This is a new search — give it a few seconds and results will start appearing."
        : "Try a different spelling, or loosen your filters.";
      renderEmpty(msg, sub);
      if (data.needsLiveScrape) schedulePoll(query);
      return;
    }

    const lowestPrice = products.find((p) => p.price != null)?.price;
    const cf = (settings && settings.cardFeatures) || {};

    results.innerHTML = products
  .map((p) => {
    // Each product now has p.fingerprint and p.offers (array of stores)
    const lowestOffer = p.offers.reduce(
      (min, o) => (o.price != null && o.price < min.price ? o : min),
      p.offers[0]
    );

    const isBest = true; // lowestOffer is always the best price
    const outLink = lowestOffer.url;
    const isOutOfStock = lowestOffer.in_stock === false;

    const discountPct =
      lowestOffer.originalPrice && lowestOffer.price && lowestOffer.originalPrice > lowestOffer.price
        ? Math.round((1 - lowestOffer.price / lowestOffer.originalPrice) * 100)
        : null;

    const ratingHtml =
      lowestOffer.rating
        ? `<div class="card-rating"><span class="stars">${starString(lowestOffer.rating)}</span> ${Number(lowestOffer.rating).toFixed(1)}</div>`
        : "";

    const updatedHtml = p.scrapedAt
      ? `<div class="updated-at">${relativeTime(p.scrapedAt || p.scraped_at)}</div>`
      : "";

    // Build offers list (all stores for this fingerprint)
    const offersHtml = p.offers
      .map(
        (o) => `
        <div class="offer-row">
          <span class="store-badge" style="background:${o.storeColor || "#666"}">${o.store}</span>
          <span class="price">${o.price != null ? formatPKR(o.price) : "N/A"}</span>
          ${o.in_stock === false ? `<span class="out-of-stock-tag">Out of stock</span>` : ""}
        </div>`
      )
      .join("");

    return `
      <div class="card ${isOutOfStock ? "out-of-stock" : ""}">
        ${isBest ? `<div class="best-ribbon">Best price</div>` : ""}
        <div class="card-image">${p.image ? `<img src="${p.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}</div>
        <div class="card-body">
          <div class="card-title">${p.title || p.fingerprint}</div>
          ${ratingHtml}
          <div class="price-row">
            <span class="price">${formatPKR(lowestOffer.price)}</span>
            ${discountPct ? `<span class="discount-badge">${discountPct}% OFF</span>` : ""}
          </div>
          ${updatedHtml}
          <div class="offers-list">${offersHtml}</div>
        </div>
      </div>`;
  })
  .join("");


    const storeText = data.storeCount === 1 ? "1 store" : `${data.storeCount} stores`;
    statusLine.innerHTML = `<strong>${products.length}</strong> results from <strong>${storeText}</strong>${data.needsLiveScrape ? " — refreshing in the background..." : ""}`;
    if (data.needsLiveScrape) schedulePoll(query);
  }

  function schedulePoll(query) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => { if (query === currentQuery) fetchResults(query); }, 4000);
  }

  async function fetchResults(query) {
    currentQuery = query;
    try {
      const params = buildParams(query);
      const res = await fetch(`${CFG.API_BASE_URL}/api/products?${params.toString()}`);
      const data = await res.json();
      if (query === currentQuery) renderResults(data, query);
    } catch (err) {
      if (query === currentQuery) renderEmpty("Something went wrong", "Couldn't reach the server — try again in a moment.");
    }
  }

  input.addEventListener("input", (e) => {
    const query = e.target.value.trim();
    clearTimeout(debounceTimer); clearTimeout(pollTimer);
    if (!query) {
      currentQuery = ""; results.innerHTML = ""; statusLine.innerHTML = ""; filterBar.classList.remove("visible");
      return;
    }
    filterBar.classList.add("visible");
    renderSkeleton();
    statusLine.innerHTML = "";
    debounceTimer = setTimeout(() => fetchResults(query), 400);
  });

  [minPriceEl, maxPriceEl].forEach((el) => {
    el.addEventListener("input", () => {
      clearTimeout(priceDebounceTimer);
      priceDebounceTimer = setTimeout(() => { if (currentQuery) fetchResults(currentQuery); }, 500);
    });
  });
  inStockOnlyEl.addEventListener("change", () => { if (currentQuery) fetchResults(currentQuery); });
  sortSelectEl.addEventListener("change", () => { if (currentQuery) fetchResults(currentQuery); });

  loadSettings();
  loadStores();
})();
</script>

</body>
</html>
