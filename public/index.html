<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sasta.pk — Compare prices across Pakistan's top stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRAND KIT — edit these to reskin the whole site
   ============================================================ */
:root {
  --brand-name: "Sasta.pk";
  --brand-tagline: "Find it cheaper, before you buy it.";

  --color-bg: #FAF7F0;          /* warm off-white background */
  --color-surface: #FFFFFF;      /* card background */
  --color-ink: #17231D;          /* primary text */
  --color-ink-soft: #5B6B62;     /* secondary text */
  --color-brand: #0B6E4F;        /* deep green — primary brand color */
  --color-brand-dark: #094F39;
  --color-accent: #E8A33D;       /* warm gold — savings / best price */
  --color-accent-dark: #C4841F;
  --color-line: #E4DDCB;         /* hairline / dashed edges */
  --color-danger: #C24B3F;

  --font-display: "Space Grotesk", sans-serif;
  --font-body: "Inter", sans-serif;

  --radius: 14px;
}

/* ============================================================
   API CONFIG — point this at your deployed backend
   ============================================================ */
</style>
<script>
  window.APP_CONFIG = {
    API_BASE_URL: "", // empty = same origin as this page (this is now served by the same Express app that runs the API)
    BRAND_NAME: "Sasta.pk",
  };
</script>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 2px solid var(--color-brand);
    outline-offset: 2px;
  }

  /* ---------- Header ---------- */
  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1080px;
    margin: 0 auto;
  }
  .logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    color: var(--color-brand-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { color: var(--color-accent); }
  .header-tag {
    font-size: 13px;
    color: var(--color-ink-soft);
    display: none;
  }
  @media (min-width: 640px) {
    .header-tag { display: block; }
  }

  /* ---------- Hero / search ---------- */
  .hero {
    max-width: 720px;
    margin: 24px auto 8px;
    padding: 0 24px;
    text-align: center;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.15;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .hero p {
    color: var(--color-ink-soft);
    margin: 0 0 28px;
    font-size: 15px;
  }

  .search-box {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
  }
  .search-box input {
    width: 100%;
    padding: 16px 52px 16px 20px;
    font-size: 16px;
    font-family: var(--font-body);
    border: 1.5px solid var(--color-line);
    border-radius: 999px;
    background: var(--color-surface);
    color: var(--color-ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-box input:focus {
    border-color: var(--color-brand);
    box-shadow: 0 0 0 4px rgba(11, 110, 79, 0.1);
  }
  .search-box svg {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--color-ink-soft);
    pointer-events: none;
  }

  /* ---------- Status line ---------- */
  .status-line {
    max-width: 1080px;
    margin: 22px auto 4px;
    padding: 0 24px;
    font-size: 13px;
    color: var(--color-ink-soft);
    min-height: 18px;
  }
  .status-line strong { color: var(--color-ink); }

  /* ---------- Results grid ---------- */
  .results {
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }

  /* Receipt/ticket-stub card — the signature element.
     Dashed perforation + torn-corner notch, echoing a till receipt,
     since this product's whole job is comparing receipts across stores. */
  .card {
    background: var(--color-surface);
    border-radius: var(--radius);
    border: 1px solid var(--color-line);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(23, 35, 29, 0.08);
  }
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--color-bg);
    border-radius: 50%;
    top: 128px;
    z-index: 2;
  }
  .card::before { left: -8px; }
  .card::after { right: -8px; }

  .card-image {
    height: 128px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: #FCFAF4;
  }
  .card-image img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }

  .card-perforation {
    border-top: 1.5px dashed var(--color-line);
    margin: 0 18px;
  }

  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .store-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    color: #fff;
    width: fit-content;
    letter-spacing: 0.01em;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--color-ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .price-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .price {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    color: var(--color-ink);
  }
  .price-original {
    font-size: 12px;
    color: var(--color-ink-soft);
    text-decoration: line-through;
  }

  .best-ribbon {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--color-accent);
    color: #2A1B04;
    font-size: 10.5px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    z-index: 3;
    letter-spacing: 0.02em;
  }

  .out-of-stock {
    filter: grayscale(0.5);
    opacity: 0.6;
  }
  .out-of-stock-tag {
    font-size: 11px;
    color: var(--color-danger);
    font-weight: 600;
  }

  /* ---------- Empty / loading states ---------- */
  .state-panel {
    max-width: 420px;
    margin: 60px auto;
    text-align: center;
    padding: 0 24px;
  }
  .state-panel .icon {
    font-size: 34px;
    margin-bottom: 12px;
  }
  .state-panel h3 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 6px;
  }
  .state-panel p {
    color: var(--color-ink-soft);
    font-size: 14px;
    margin: 0;
  }

  .skeleton {
    background: linear-gradient(90deg, #F1EDE1 25%, #E9E3D3 37%, #F1EDE1 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: var(--radius);
    height: 240px;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--color-ink-soft);
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span id="brand-name-slot">Sasta<span class="dot">.pk</span></span></div>
  <div class="header-tag">Prices refreshed live from every store</div>
</header>

<div class="hero">
  <h1>Same phone. Different price. <br>Find out which store is lying.</h1>
  <p id="tagline-slot">Search once, compare instantly across Pakistan's top stores.</p>
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search e.g. Xiaomi Redmi 15C"
      autocomplete="off"
      aria-label="Search for a product"
    >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>
</div>

<div class="status-line" id="statusLine"></div>
<div class="results" id="results"></div>

<footer>
  <span id="brand-name-footer-slot">Sasta.pk</span> — prices are pulled directly from each store and may change without notice.
</footer>

<script>
(function () {
  const CFG = window.APP_CONFIG;
  document.title = `${CFG.BRAND_NAME} — Compare prices across Pakistan's top stores`;

  const input = document.getElementById("searchInput");
  const results = document.getElementById("results");
  const statusLine = document.getElementById("statusLine");

  let debounceTimer = null;
  let pollTimer = null;
  let currentQuery = "";

  function formatPKR(n) {
    if (n === null || n === undefined) return null;
    return "Rs " + Number(n).toLocaleString("en-PK");
  }

  function renderSkeleton() {
    results.innerHTML = Array.from({ length: 8 })
      .map(() => `<div class="skeleton"></div>`)
      .join("");
  }

  function renderEmpty(message, sub) {
    results.innerHTML = "";
    statusLine.innerHTML = "";
    const panel = document.createElement("div");
    panel.className = "state-panel";
    panel.innerHTML = `
      <div class="icon">🧾</div>
      <h3>${message}</h3>
      <p>${sub}</p>
    `;
    results.appendChild(panel);
  }

  function renderResults(data, query) {
    const products = [...data.products].sort((a, b) => {
      if (a.price == null) return 1;
      if (b.price == null) return -1;
      return a.price - b.price;
    });

    if (products.length === 0) {
      const msg = data.needsLiveScrape
        ? "Checking stores now..."
        : "No results found";
      const sub = data.needsLiveScrape
        ? "This is a new search — give it a few seconds and results will start appearing."
        : "Try a different spelling or a more general term.";
      renderEmpty(msg, sub);
      if (data.needsLiveScrape) schedulePoll(query);
      return;
    }

    const lowestPrice = products.find((p) => p.price != null)?.price;

    results.innerHTML = products
      .map((p) => {
        const isBest = p.price === lowestPrice;
        const outLink = `${CFG.API_BASE_URL}/out/${p.id}`;
        return `
        <a class="card ${p.inStock === false ? "out-of-stock" : ""}" href="${outLink}" target="_blank" rel="noopener">
          ${isBest ? `<div class="best-ribbon">Best price</div>` : ""}
          <div class="card-image">
            ${p.image ? `<img src="${p.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
          </div>
          <div class="card-perforation"></div>
          <div class="card-body">
            <span class="store-badge" style="background:${p.storeColor || "#666"}">${p.store}</span>
            <div class="card-title">${p.title}</div>
            <div class="price-row">
              ${p.price != null ? `<span class="price">${formatPKR(p.price)}</span>` : `<span class="price-original">Price unavailable</span>`}
              ${p.originalPrice ? `<span class="price-original">${formatPKR(p.originalPrice)}</span>` : ""}
              ${p.inStock === false ? `<span class="out-of-stock-tag">Out of stock</span>` : ""}
            </div>
          </div>
        </a>
      `;
      })
      .join("");

    const storeText = data.storeCount === 1 ? "1 store" : `${data.storeCount} stores`;
    statusLine.innerHTML = `<strong>${products.length}</strong> results from <strong>${storeText}</strong>${data.needsLiveScrape ? " — refreshing in the background..." : ""}`;

    if (data.needsLiveScrape) schedulePoll(query);
  }

  function schedulePoll(query) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => {
      if (query === currentQuery) fetchResults(query);
    }, 4000);
  }

  async function fetchResults(query) {
    currentQuery = query;
    try {
      const res = await fetch(
        `${CFG.API_BASE_URL}/api/products?q=${encodeURIComponent(query)}&limit=50`
      );
      const data = await res.json();
      if (query === currentQuery) renderResults(data, query);
    } catch (err) {
      if (query === currentQuery) {
        renderEmpty("Something went wrong", "Couldn't reach the server — try again in a moment.");
      }
    }
  }

  input.addEventListener("input", (e) => {
    const query = e.target.value.trim();
    clearTimeout(debounceTimer);
    clearTimeout(pollTimer);

    if (!query) {
      currentQuery = "";
      results.innerHTML = "";
      statusLine.innerHTML = "";
      return;
    }

    renderSkeleton();
    statusLine.innerHTML = "";
    debounceTimer = setTimeout(() => fetchResults(query), 400);
  });
})();
</script>

</body>
</html>
