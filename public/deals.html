<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Price Drops &amp; Deals — Sasta.pk</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #F7F5EF;
    --color-surface: #FFFFFF;
    --color-ink: #17231D;
    --color-ink-soft: #6B7A70;
    --color-brand: #0B6E4F;
    --color-brand-dark: #094F39;
    --color-line: #E7E1D2;
    --color-accent: #E8A33D;
    --color-danger: #C24B3F;
    --radius-lg: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-ink); font-family: "Inter", sans-serif; font-size: 14px; }
  h1, h2, h3 { font-family: "Space Grotesk", sans-serif; margin: 0; }
  a { text-decoration: none; color: inherit; }

  header { background: var(--color-surface); border-bottom: 1px solid var(--color-line); padding: 16px 24px; position: sticky; top: 0; z-index: 100; }
  .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 20px; color: var(--color-ink); }
  .logo .dot { color: var(--color-brand); }
  .nav-links { display: flex; gap: 16px; font-weight: 500; font-size: 13.5px; }
  .nav-links a { color: var(--color-ink-soft); }
  .nav-links a.active, .nav-links a:hover { color: var(--color-brand); }

  .main-container { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-size: 24px; margin-bottom: 6px; }
  .page-header p { color: var(--color-ink-soft); font-size: 14px; }

  /* Product Grid and Card Shared Styles */
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
  
  .card-header-banner { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 2; pointer-events: none; }
  .best-ribbon { background: var(--color-ink); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .match-badge { background: var(--color-brand); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

  .card-image { height: 180px; display: flex; align-items: center; justify-content: center; background: #fff; padding: 16px; position: relative; }
  .card-image img { max-height: 100%; max-width: 100%; object-fit: contain; }

  .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .meta-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .category-pill { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-ink-soft); font-weight: 600; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--color-ink); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .card-divider { border: none; border-top: 1px solid var(--color-line); margin: 12px 0; }
  
  .offers-section { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
  .offers-heading { font-size: 11px; text-transform: uppercase; color: var(--color-ink-soft); font-weight: 600; display: flex; justify-content: space-between; }
  .offer-row-link { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: var(--color-bg); border-radius: var(--radius-sm); border: 1px solid transparent; transition: border-color 0.15s ease; }
  .offer-row-link:hover { border-color: var(--color-brand); }
  .store-badge { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 4px; }
  .offer-price { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 13.5px; color: var(--color-ink); }

  .state-panel { grid-column: 1 / -1; text-align: center; padding: 60px 20px; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); }
  .state-panel h3 { font-size: 18px; margin-bottom: 6px; }
  .state-panel p { color: var(--color-ink-soft); font-size: 13.5px; }
</style>
</head>
<body>

<header>
  <div class="header-container">
    <a href="/" class="logo">Sasta<span class="dot">.pk</span></a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/deals.html" class="active">🔥 Top Deals</a>
    </nav>
  </div>
</header>

<main class="main-container">
  <div class="page-header">
    <h1>Top Price Drops &amp; Deals</h1>
    <p>Discover items that experienced the biggest absolute price cuts across all monitored stores.</p>
  </div>

  <div class="results" id="results">
    <!-- Dynamically loaded deal product cards -->
  </div>

  <div id="productsSentinel" style="height: 20px; text-align: center; margin: 30px 0;" class="muted">
    Loading more deals...
  </div>
</main>

<script>
(function () {
  const CFG = window.APP_CONFIG || { API_BASE_URL: "" };
  const results = document.getElementById("results");
  let cachedDeals = [];

  function formatPKR(n) {
    if (n === null || n === undefined) return "N/A";
    return "Rs " + Number(n).toLocaleString("en-PK");
  }

  function renderDealCardsMarkup(items) {
    return items.map((p) => {
      const offer = p.offers[0] || {};
      const titleText = p.title || "Product Deal";

      return `
        <div class="card" data-product-id="${p.id}">
          <div class="card-header-banner">
            <div class="best-ribbon">Deal: ${formatPKR(p.min_price)}</div>
            ${p.discount_pct ? `<div class="match-badge" style="background:var(--color-brand);">${p.discount_pct}% OFF</div>` : ""}
          </div>
          <div class="card-image">
            ${p.image ? `<img src="${p.image}" alt="${titleText}" loading="lazy" onerror="this.style.display='none'">` : `<span style="font-size:36px">🔥</span>`}
          </div>
          <div class="card-body">
            <div class="meta-container">
              <span class="category-pill">${p.category}</span>
              <span style="color: var(--color-brand); font-weight: 700; font-size: 11.5px;">
                ↓ Save ${formatPKR(p.price_drop)}
              </span>
            </div>
            <div class="card-title" title="${titleText}">${titleText}</div>
            
            <div style="margin: 8px 0; font-size: 12px; color: var(--color-ink-soft);">
              Original: <span style="text-decoration: line-through;">${formatPKR(p.old_price)}</span>
            </div>

            <hr class="card-divider">
            <div class="offers-section">
              <div class="offers-heading"><span>Store</span><span>Deal Price</span></div>
              <a href="${CFG.API_BASE_URL}/out/${offer.id}" target="_blank" rel="noopener" class="offer-row-link">
                <div class="store-info-left">
                  <span class="store-badge" style="background:${offer.storeColor || '#0B6E4F'}">${offer.store}</span>
                </div>
                <div class="offer-price-right">
                  <span class="offer-price">${formatPKR(offer.price)}</span>
                </div>
              </a>
            </div>
          </div>
        </div>`;
    }).join("");
  }

  function setupInfiniteScroll({ containerSelector, sentinelId, pageSize = 12 }) {
    let offset = 0;
    let isLoading = false;
    let hasMore = true;

    const container = document.querySelector(containerSelector);
    const sentinel = document.getElementById(sentinelId);
    if (!container || !sentinel) return;

    const observer = new IntersectionObserver(async (entries) => {
      if (entries[0].isIntersecting && !isLoading && hasMore) {
        isLoading = true;
        
        try {
          const res = await fetch(`${CFG.API_BASE_URL}/api/deals?limit=${pageSize}&offset=${offset}`);
          const data = await res.json();
          const items = data.products || [];

          if (offset === 0 && items.length === 0) {
            container.innerHTML = `<div class="state-panel"><h3>No Deals Found</h3><p>Check back later for price drops.</p></div>`;
            sentinel.style.display = "none";
            return;
          }

          if (items.length < pageSize) {
            hasMore = false;
            sentinel.style.display = "none";
          }

          if (items.length > 0) {
            cachedDeals.push(...items);
            container.insertAdjacentHTML("beforeend", renderDealCardsMarkup(items));
            offset += pageSize;
          }
        } catch (err) {
          console.error("Failed to load deals:", err);
        } finally {
          isLoading = false;
        }
      }
    }, { rootMargin: "300px" });

    observer.observe(sentinel);
  }

  async function initDealsPage() {
    try {
      const setRes = await fetch(`${CFG.API_BASE_URL}/api/settings`);
      const settings = await setRes.json();
      const pageSize = settings.productsPerPage ? Number(settings.productsPerPage) : 12;

      setupInfiniteScroll({
        containerSelector: "#results",
        sentinelId: "productsSentinel",
        pageSize
      });
    } catch (e) {
      setupInfiniteScroll({
        containerSelector: "#results",
        sentinelId: "productsSentinel",
        pageSize: 12
      });
    }
  }

  initDealsPage();
})();
</script>
</body>
</html>
